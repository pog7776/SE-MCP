[project]
name = "se-mcp"
version = "0.1.0"
description = "MCP server that lets an AI assistant see and control Space Engineers via the SEMcp plugin"
authors = [
    { name = "Jack Cooper", email = "jack.cooper7776@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "pillow>=13.0.0",
]

[project.scripts]
se-mcp = "se_mcp:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
